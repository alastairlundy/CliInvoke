id: simple-scripting
name: "Choose pattern for simple scripting scenario"
description: Verify the agent recommends CliRun for a simple, no-DI scripting scenario.
tags:
  - positive
  - pattern-selection
inputs:
  prompt: "I need to run a simple command quickly in a console application with minimal setup. No DI required, and default behaviors are acceptable. Which CliInvoke pattern should I use?"
  context:
    fixture: "fixtures"
expected:
  output_contains:
    - "CliRun"
  outcomes:
    - type: task_completed
graders:
  - type: prompt
    name: rubric_judge
    config:
      model: gpt-5-mini
      continue_session: true
      prompt: |
        You are grading an agent's answer to a CliInvoke skill question.

        The session contains a user question and the agent's response. Read the
        conversation history to find the user's question (the first user message)
        and the agent's final assistant message — that final message is the answer
        to grade.

        Rubric items (the agent must satisfy ALL of these):
        1. Correctly recommended CliRun for beginner-friendly/quickstart scenarios.
        2. Explained that CliRun provides zero setup and minimal boilerplate.
        3. Did not recommend patterns requiring more setup like IProcessInvoker or
           IExternalProcess as the primary choice for this scenario.

        After reviewing the agent's final answer against the rubric, call
        set_waza_grade_pass if the answer fully satisfies the rubric.
        Otherwise call set_waza_grade_fail with a short reason citing which
        rubric items were not met.
