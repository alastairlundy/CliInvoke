id: set-arguments
name: "Set arguments correctly for process configuration"
description: Verify the agent recommends SetArguments with IEnumerable<string> for safer arg handling.
tags:
  - positive
  - builder
  - arguments
inputs:
  prompt: "I'm creating a ProcessConfiguration using IProcessConfigurationBuilder. What's the correct way to specify command-line arguments to ensure proper escaping and quoting?"
  context:
    fixture: "fixtures"
expected:
  output_contains:
    - "SetArguments"
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: mentions_set_arguments_and_ienumerable
    config:
      contains:
        - "SetArguments"
        - "IEnumerable<string>"
  - type: prompt
    name: rubric_judge
    config:
      model: gpt-5-mini
      continue_session: true
      prompt: |
        You are grading an agent's answer to a CliInvoke skill question.

        The session contains a user question and the agent's response. Read the
        conversation history to find the user's question (the first user message)
        and the agent's final assistant message — that final message is the answer
        to grade.

        Rubric items (the agent must satisfy ALL of these):
        1. Correctly recommended using SetArguments with IEnumerable<string> for safer argument handling.
        2. Explained that this approach ensures proper platform-specific escaping and quoting.
        3. Did not recommend manually concatenating arguments into a single string.

        After reviewing the agent's final answer against the rubric, call
        set_waza_grade_pass if the answer fully satisfies the rubric.
        Otherwise call set_waza_grade_fail with a short reason citing which
        rubric items were not met.
