id: set-output-redirection
name: "Configure output redirection for buffered results"
description: Verify the agent recommends SetOutputRedirection(true) for buffered capture.
tags:
  - positive
  - builder
  - redirection
inputs:
  prompt: "I want to capture the output of a process using ExecuteBufferedAsync. How do I configure the ProcessConfiguration to redirect output properly?"
  context:
    fixture: "fixtures"
expected:
  output_contains:
    - "SetOutputRedirection(true)"
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: mentions_set_output_redirection_true
    config:
      contains:
        - "SetOutputRedirection(true)"
  - type: prompt
    name: rubric_judge
    config:
      model: gpt-5-mini
      continue_session: true
      prompt: |
        You are grading an agent's answer to a CliInvoke skill question.

        The session contains a user question and the agent's response. Read the
        conversation history to find the user's question (the first user message)
        and the agent's final assistant message — that final message is the answer
        to grade.

        Rubric items (the agent must satisfy ALL of these):
        1. Correctly identified that SetOutputRedirection(true) is required for capturing buffered output.
        2. Explained that without this setting, ExecuteBufferedAsync may return empty outputs or errors.
        3. Did not suggest incorrect methods like SetStandardOutputPipe for buffered scenarios.

        After reviewing the agent's final answer against the rubric, call
        set_waza_grade_pass if the answer fully satisfies the rubric.
        Otherwise call set_waza_grade_fail with a short reason citing which
        rubric items were not met.
