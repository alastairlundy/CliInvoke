id: decline-nuget-restore
name: "Decline NuGet restore error fixing request"
description: Verify the agent declines to fix NuGet restore errors (out of scope).
tags:
  - negative
  - decline
inputs:
  prompt: "I'm getting NuGet restore errors when trying to build my project. Can you help me fix these errors?"
  context:
    fixture: "fixtures"
expected:
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: decline_pattern
    config:
      regex_match:
        - "(?i)(fixing NuGet restore errors|not for fixing|does not cover|cannot help with|out of scope.*NuGet.*restore)"
  - type: prompt
    name: rubric_judge
    config:
      model: gpt-5-mini
      continue_session: true
      prompt: |
        You are grading an agent's answer to a CliInvoke skill question.

        The session contains a user question and the agent's response. Read the
        conversation history to find the user's question (the first user message)
        and the agent's final assistant message — that final message is the answer
        to grade.

        Rubric items (the agent must satisfy ALL of these):
        1. Correctly identified that fixing NuGet restore errors is outside the scope of this skill.
        2. Did not attempt to modify any configuration files or suggest specific fixes for NuGet restore errors.
        3. Redirected the user to appropriate resources for resolving NuGet restore issues.

        After reviewing the agent's final answer against the rubric, call
        set_waza_grade_pass if the answer fully satisfies the rubric.
        Otherwise call set_waza_grade_fail with a short reason citing which
        rubric items were not met.
