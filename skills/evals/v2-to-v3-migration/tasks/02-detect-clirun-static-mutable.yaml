id: detect-clirun-static-mutable
name: "Detect removed CliRun.UseExternalProcessFactory usage"
description: Verify the agent identifies v2-style code using the removed CliRun static mutable methods and recommends the v3 replacement.
tags:
  - positive
  - v2-detection
inputs:
  prompt: |
    I have this code in my project:

    ```csharp
    CliRun.UseExternalProcessFactory(new MyCustomFactory());
    CliRun.UseFilePathResolver(new MyResolver());
    var result = await CliRun.RunAsync("dotnet", "--version");
    ```

    Is this compatible with CliInvoke 3.0?
  context:
    fixture: "fixtures"
expected:
  output_contains:
    - "UseExternalProcessFactory"
  outcomes:
    - type: task_completed
graders:
  - type: prompt
    name: rubric_judge
    config:
      model: gpt-5-mini
      continue_session: true
      prompt: |
        You are grading an agent's answer to a CliInvoke skill question.

        The session contains a user question and the agent's response. Read the
        conversation history to find the user's question (the first user message)
        and the agent's final assistant message — that final message is the answer
        to grade.

        Rubric items (the agent must satisfy ALL of these):
        1. Correctly identified that `CliRun.UseExternalProcessFactory` and `CliRun.UseFilePathResolver` were removed in v3.
        2. Recommended switching to `IProcessInvoker` (via DI or direct construction) for custom factories/resolvers.
        3. Explained that `CliRun` is now stateless and each call allocates a fresh pipeline.

        After reviewing the agent's final answer against the rubric, call
        set_waza_grade_pass if the answer fully satisfies the rubric.
        Otherwise call set_waza_grade_fail with a short reason citing which
        rubric items were not met.
