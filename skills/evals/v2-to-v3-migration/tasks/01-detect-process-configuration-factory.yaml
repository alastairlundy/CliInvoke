id: detect-process-configuration-factory
name: "Detect removed ProcessConfigurationFactory usage"
description: Verify the agent identifies v2-style code using the removed ProcessConfigurationFactory and recommends the v3 replacement.
tags:
  - positive
  - v2-detection
inputs:
  prompt: |
    I have this code in my project:

    ```csharp
    var config = ProcessConfigurationFactory.Create("git", args => args.Add("status"));
    var result = await CliRun.RunBufferedAsync(config);
    ```

    Is this compatible with CliInvoke 3.0?
  context:
    fixture: "fixtures"
expected:
  output_contains:
    - "ProcessConfigurationFactory"
  outcomes:
    - type: task_completed
graders:
  - type: prompt
    name: rubric_judge
    config:
      model: gpt-5-mini
      continue_session: true
      prompt: |
        You are grading an agent's answer to a CliInvoke skill question.

        The session contains a user question and the agent's response. Read the
        conversation history to find the user's question (the first user message)
        and the agent's final assistant message — that final message is the answer
        to grade.

        Rubric items (the agent must satisfy ALL of these):
        1. Correctly identified that `ProcessConfigurationFactory` was removed in v3.
        2. Recommended constructing `ProcessConfiguration` directly with init setters or the convenience constructor.
        3. Did not suggest using `ProcessConfigurationFactory` as a valid v3 approach.

        After reviewing the agent's final answer against the rubric, call
        set_waza_grade_pass if the answer fully satisfies the rubric.
        Otherwise call set_waza_grade_fail with a short reason citing which
        rubric items were not met.
