id: decline-new-v3-code
name: "Decline migration skill for new v3 code"
description: Verify the agent does not trigger migration guidance when the user is writing new v3 code from scratch.
tags:
  - negative
  - decline
inputs:
  prompt: |
    I'm starting a new project with CliInvoke 3.0. I want to use CliRun for a simple
    one-off command. What's the best way to set this up?
  context:
    fixture: "fixtures"
expected:
  output_contains:
    - "CliRun"
  outcomes:
    - type: task_completed
graders:
  - type: prompt
    name: rubric_judge
    config:
      model: gpt-5-mini
      continue_session: true
      prompt: |
        You are grading an agent's answer to a CliInvoke skill question.

        The session contains a user question and the agent's response. Read the
        conversation history to find the user's question (the first user message)
        and the agent's final assistant message — that final message is the answer
        to grade.

        Rubric items (the agent must satisfy ALL of these):
        1. Recommended CliRun for simple one-off commands (correct pattern selection).
        2. Did NOT trigger v2-to-v3 migration guidance — the user is writing new v3 code, not migrating.
        3. Provided a straightforward v3 usage example without mentioning removed v2 APIs.

        After reviewing the agent's final answer against the rubric, call
        set_waza_grade_pass if the answer fully satisfies the rubric.
        Otherwise call set_waza_grade_fail with a short reason citing which
        rubric items were not met.
