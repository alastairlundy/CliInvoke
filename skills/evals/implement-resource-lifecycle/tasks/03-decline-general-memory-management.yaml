id: decline-general-memory-management
name: "Decline request for general C# memory management"
description: Verify the agent declines general C# memory management guidance (out of scope).
tags:
  - negative
  - decline
inputs:
  prompt: "I'm having issues with memory management in my C# application. Can you help me identify and fix memory leaks?"
  context:
    fixture: "fixtures"
expected:
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: decline_pattern
    config:
      regex_match:
        - "(?i)(general C# memory management|not for general memory|does not cover|cannot help with|out of scope.*memory.*management)"
  - type: prompt
    name: rubric_judge
    config:
      model: gpt-5-mini
      continue_session: true
      prompt: |
        You are grading an agent's answer to a CliInvoke skill question.

        The session contains a user question and the agent's response. Read the
        conversation history to find the user's question (the first user message)
        and the agent's final assistant message — that final message is the answer
        to grade.

        Rubric items (the agent must satisfy ALL of these):
        1. Correctly identified that general C# memory management is outside the scope of this skill.
        2. Did not attempt to provide general memory management guidance.
        3. Redirected the user to appropriate resources for learning general C# memory management.

        After reviewing the agent's final answer against the rubric, call
        set_waza_grade_pass if the answer fully satisfies the rubric.
        Otherwise call set_waza_grade_fail with a short reason citing which
        rubric items were not met.
