name: Publish Packages to Nuget

on:
  workflow_dispatch:
     inputs:
      core-version:
         type: string
         required: true
      main-version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-and-publish:
      runs-on: ubuntu-latest
  
      permissions:
        id-token: write 
      environment: production
        
      steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Create local nupkg output dir
        run: mkdir -p ./nupkgs

      # Build Core
      - name: Build Core
        run: dotnet build src/CliInvoke.Core -c Release

      # Pack Core into ./nupkgs
      - name: Pack Core to local feed
        run: dotnet pack src/CliInvoke.Core -c Release -o ./nupkgs

      # Main: resolve CliInvoke.Core from the local feed so the packed
      # dependency is pinned exactly to core-version and can never float.
      # Main is packed before Specializations so the CliInvoke package is
      # already in the local feed when Specializations restores.
      - name: Restore Main from local feed + NuGet.org
        run: dotnet restore src/CliInvoke -s ./nupkgs -s https://api.nuget.org/v3/index.json /p:UsePublishedPackages=true /p:CliInvokeCoreVersion=${{ inputs.core-version }}

      - name: Build Main (resolves CliInvoke.Core from local feed)
        run: dotnet build src/CliInvoke -c Release --no-restore /p:UsePublishedPackages=true /p:CliInvokeCoreVersion=${{ inputs.core-version }}

      # Pack Main so its nupkg lands in ./nupkgs (all resulting nupkgs end up in ./nupkgs)
      - name: Pack Main into local feed
        run: dotnet pack src/CliInvoke -c Release -o ./nupkgs --no-restore /p:UsePublishedPackages=true /p:CliInvokeCoreVersion=${{ inputs.core-version }}

      # Specializations: packed after Main so both CliInvoke.Core and CliInvoke
      # are already in the local feed (Specializations depends on both packages).
      - name: Restore Specializations from local feed + NuGet.org
        run: dotnet restore src/CliInvoke.Specializations -s ./nupkgs -s https://api.nuget.org/v3/index.json /p:UsePublishedPackages=true /p:CliInvokeCoreVersion=${{ inputs.core-version }} /p:CliInvokeVersion=${{ inputs.main-version }}

      - name: Build Specializations (resolves CliInvoke.Core/CliInvoke from local feed)
        run: dotnet build src/CliInvoke.Specializations -c Release --no-restore /p:UsePublishedPackages=true /p:CliInvokeCoreVersion=${{ inputs.core-version }} /p:CliInvokeVersion=${{ inputs.main-version }}

      - name: Pack Specializations into local feed
        run: dotnet pack src/CliInvoke.Specializations -c Release -o ./nupkgs --no-restore /p:UsePublishedPackages=true /p:CliInvokeCoreVersion=${{ inputs.core-version }} /p:CliInvokeVersion=${{ inputs.main-version }}

      # Authenticate to NuGet (OIDC)
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Push all nupkgs (no sleeps needed)
      - name: Push all nupkgs to NuGet.org
        run: |
          for f in ./nupkgs/*.nupkg; do
            dotnet nuget push "$f" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
