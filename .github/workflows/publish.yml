name: Publish Packages to Nuget

on:
  workflow_dispatch:
     inputs:
      core-version:
         type: string
         required: true
      main-version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-and-publish:
      runs-on: ubuntu-latest
  
      permissions:
        id-token: write 
      environment: production
        
      steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Create local nupkg output dir
        run: mkdir -p ./nupkgs

      # Build Core
      - name: Build Core
        run: dotnet build src/CliInvoke.Core -c Release

      # Pack Core into ./nupkgs (local feed for the steps below)
      - name: Pack Core to local feed
        run: dotnet pack src/CliInvoke.Core -c Release -o ./nupkgs

      # Specializations: resolve CliInvoke.Core from the local feed so the packed
      # dependency is capped to [core-version, 3.0.0) and can never float to v3.
      # An explicit build is required: pack --no-restore does not reliably
      # materialize all target-framework outputs on a cold tree.
      - name: Restore Specializations from local feed + NuGet.org
        run: dotnet restore src/CliInvoke.Specializations -s ./nupkgs -s https://api.nuget.org/v3/index.json /p:UsePublishedPackages=true /p:CliInvokeCoreVersion=${{ inputs.core-version }}

      - name: Build Specializations (resolves CliInvoke.Core from local feed)
        run: dotnet build src/CliInvoke.Specializations -c Release --no-restore /p:UsePublishedPackages=true /p:CliInvokeCoreVersion=${{ inputs.core-version }}

      - name: Pack Specializations into local feed
        run: dotnet pack src/CliInvoke.Specializations -c Release -o ./nupkgs --no-restore /p:UsePublishedPackages=true /p:CliInvokeCoreVersion=${{ inputs.core-version }}

      # Main: same pattern, packed after Specializations so ordering is Core -> Main.
      - name: Restore Main from local feed + NuGet.org
        run: dotnet restore src/CliInvoke -s ./nupkgs -s https://api.nuget.org/v3/index.json /p:UsePublishedPackages=true /p:CliInvokeCoreVersion=${{ inputs.core-version }}

      - name: Build Main (resolves CliInvoke.Core from local feed)
        run: dotnet build src/CliInvoke -c Release --no-restore /p:UsePublishedPackages=true /p:CliInvokeCoreVersion=${{ inputs.core-version }}

      - name: Pack Main into local feed
        run: dotnet pack src/CliInvoke -c Release -o ./nupkgs --no-restore /p:UsePublishedPackages=true /p:CliInvokeCoreVersion=${{ inputs.core-version }}

      # Extensions: restored last so both CliInvoke.Core and CliInvoke
      # 2.11.3.1 equivalents are already in the local feed.
      - name: Restore Extensions from local feed + NuGet.org
        run: dotnet restore src/CliInvoke.Extensions -s ./nupkgs -s https://api.nuget.org/v3/index.json /p:UsePublishedPackages=true /p:CliInvokeCoreVersion=${{ inputs.core-version }} -p:CliInvokeVersion=${{ inputs.main-version }}

      - name: Build Extensions (resolves CliInvoke.Core/CliInvoke from local feed)
        run: dotnet build src/CliInvoke.Extensions -c Release --no-restore /p:UsePublishedPackages=true /p:CliInvokeCoreVersion=${{ inputs.core-version }} -p:CliInvokeVersion=${{ inputs.main-version }}

      - name: Pack Extensions into local feed
        run: dotnet pack src/CliInvoke.Extensions -c Release -o ./nupkgs --no-restore /p:UsePublishedPackages=true /p:CliInvokeCoreVersion=${{ inputs.core-version }} -p:CliInvokeVersion=${{ inputs.main-version }}


      # Authenticate to NuGet (OIDC)
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Push all nupkgs (no sleeps needed)
      - name: Push all nupkgs to NuGet.org
        run: |
          for f in ./nupkgs/*.nupkg; do
            dotnet nuget push "$f" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
