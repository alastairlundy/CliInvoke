name: Publish Packages to Nuget

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
      runs-on: ubuntu-latest
  
      permissions:
        id-token: write 
      environment: production
        
      steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Create local nupkg output dir
        run: mkdir -p ./nupkgs

      # Pack in dependency order (Core -> Main -> Specializations).
      # Nuspec dependency versions come from the referenced projects'
      # PackageVersion properties; the local feed is only for the push step.
      - name: Pack Core
        run: dotnet pack src/CliInvoke.Core -c Release -o ./nupkgs

      - name: Pack Main
        run: dotnet pack src/CliInvoke -c Release -o ./nupkgs

      - name: Pack Specializations
        run: dotnet pack src/CliInvoke.Specializations -c Release -o ./nupkgs

      # Authenticate to NuGet (OIDC)
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Push all nupkgs (no sleeps needed)
      - name: Push all nupkgs to NuGet.org
        run: |
          for f in ./nupkgs/*.nupkg; do
            dotnet nuget push "$f" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
