name: site-repro

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'repro/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build .NET projects for API docs
        run: |
          dotnet build repro/src/MyLib -c Release
          dotnet build repro/src/MyLib.Extensions -c Release
      - name: Install Lunet
        run: |
          dotnet tool install --global lunet --version "1.*"
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: Build site
        working-directory: repro/site
        run: lunet --stacktrace build
