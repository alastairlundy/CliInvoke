# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Test Build
permissions:
  contents: read
  pull-requests: read

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout: 4
          - os: windows-latest
            timeout: 5
          - os: macos-latest
            timeout: 5

    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x
    - name: ConfigureAwait guard
      # Lint-style gate with an OS-independent outcome. Linux-only so the plain
      # 'run:' pwsh default on Windows can't stumble on the bash script.
      if: runner.os == 'Linux'
      run: bash scripts/guard-configureawait.sh src
    - name: Build
      run: dotnet build src/CliInvoke.sln
    - name: Test (CliInvoke)
      run: dotnet test
      working-directory: tests/CliInvoke.Tests/
    # PowerShell/Cmd middleware security tests (ShellInjectionSecurityTests) live in
    # the Specializations project; without this step they never execute in CI.
    # cmd-runner behavioural tests are Windows-only and skip on ubuntu by design.
    # They execute on the windows-latest matrix leg instead.
    - name: Test (Specializations)
      run: dotnet test
      working-directory: tests/CliInvoke.Specializations.Tests/
