name: site

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            src/**/obj
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build .NET projects for API docs
        run: |
          dotnet build src/CliInvoke.Core -c Release
          dotnet build src/CliInvoke -c Release
          dotnet build src/CliInvoke.Specializations -c Release
      - uses: actions/cache@v4
        with:
          path: site/.lunet/build/cache
          key: lunet-${{ hashFiles('site/config.scriban') }}
          restore-keys: lunet-
      - name: Install Lunet
        run: |
          dotnet tool install --global lunet --version "1.*"
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: Build site
        working-directory: site
        run: lunet --stacktrace build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.lunet/build/www
      - uses: actions/deploy-pages@v4
