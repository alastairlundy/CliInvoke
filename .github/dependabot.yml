# Dependabot configuration.
# All groups update weekly (Mondays) with a 3-day version cooldown so
# fast-moving packages (TUnit, Polyfill, GitHub Actions) don't open a PR
# per release. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget" # src/ package manifests (Directory.Packages.props)
    directories:
        - "src/"
        - "tests/"
        - "benchmarks/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: "nuget" # benchmarks/ package manifests (Directory.Packages.props)
    directories:
        - "benchmarks/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: "nuget" # examples/ package manifests (Directory.Packages.props)
    directories:
        - "examples/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
